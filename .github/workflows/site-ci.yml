name: Site CI — Barbecue Zone

on:
  push:
    branches: ["**"]
    paths: ["barbecue-zone-website/**"]
  pull_request:
    paths: ["barbecue-zone-website/**"]

jobs:
  validate-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Valider le HTML
        working-directory: barbecue-zone-website
        run: npx --yes html-validate@8 "*.html"
